services:
  db:
    image: postgres:17-alpine
    container_name: keymart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: keymart
      POSTGRES_PASSWORD: keymart
      POSTGRES_DB: keymart
    # Host port 5433 to avoid clashing with a locally-installed Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - keymart-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keymart -d keymart"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  keymart-pgdata:
